# Runs on every pull request and on main: the same offline checks as
# tools/check_mod.sh locally (Lua + JS syntax, version numbers, the lupa
# test harness), plus a guard against game files or build output in the repo.
# The "checks" job is the status check the main branch rules require.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test tools
        run: python -m pip install "lupa==2.8" "luaparser==4.2.0"

      - name: No game files or build output in the repo
        run: |
          bad="$(git ls-files | grep -E '(^|/)(research|toolchain|dist)/|\.(fdb|ovl|zip|luac)$' || true)"
          if [ -n "$bad" ]; then
            echo "These files must not be in the repository:"; echo "$bad"; exit 1
          fi

      - name: Checks
        env:
          PZ2_PYTHON: python
        run: bash tools/check_mod.sh .
